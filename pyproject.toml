[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "henchmen"
version = "0.2.1"
description = "AI agent factory — cloud-agnostic, villain-themed"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Chris Ciampoli"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    # Each classifier here has a CI matrix entry that runs it. 3.12 is the
    # floor (mypy python_version and ruff target-version stay on it so the
    # code remains 3.12-compatible); 3.14 is what every container image runs.
    # Add a classifier only together with a matrix entry that exercises it.
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings",
    "fastapi",
    "uvicorn",
    "httpx",
    # <3: a major release may change the Auth/Github constructor API we use.
    "PyGithub>=2.4.0,<3",
]

[project.urls]
Homepage = "https://github.com/chrisciampoli/henchmen"
Repository = "https://github.com/chrisciampoli/henchmen"
Changelog = "https://github.com/chrisciampoli/henchmen/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/chrisciampoli/henchmen/issues"

[project.scripts]
henchmen = "henchmen.cli:main"

[project.optional-dependencies]
# Extras layout
# -----------------------------------------------------------------------------
# Henchmen is cloud-agnostic. The base install is deliberately lean so that
# contributors running locally with Ollama or OpenAI do not have to download
# ~300MB of GCP and AWS SDKs. Pick the extras you actually need:
#
#   pip install -e ".[local]"            # single-process local mode (OpenAI / Anthropic / Ollama / Slack / eval history)
#   pip install -e ".[gcp]"              # GCP backends (Pub/Sub, Firestore, GCS, Vertex)
#   pip install -e ".[aws]"              # AWS backends
#   pip install -e ".[all]"              # everything (power users)
#   pip install -e ".[local,dev]"        # local mode + dev tooling
#   pip install -e ".[dev-integration]"  # everything + dev tooling + integration tests
#
# Note: `dev` only installs developer tooling (pytest, ruff, mypy, etc.) on
# top of whatever runtime extras you picked. It does NOT pull `all`. If you
# need the full stack for integration tests, use `dev-integration` instead.
gcp = [
    "google-cloud-pubsub",
    "google-cloud-firestore",
    "google-cloud-storage",
    "google-cloud-run",
    "google-cloud-build",
    "google-cloud-aiplatform",
    "vertexai",
    "google-genai",
]
aws = [
    "boto3>=1.34",
    # providers/aws/codebuild.py imports yaml at module scope; boto3 does not
    # pull it in, so `pip install henchmen[aws]` alone would ImportError.
    "pyyaml>=6.0",
]
openai = [
    "openai>=1.0",
]
anthropic = [
    "anthropic>=0.30",
]
slack = [
    "slack-bolt",
]
jira = [
    "jira",
]
observability = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-gcp-trace>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "prometheus-client>=0.19",
]
# Everything a self-hoster needs to run Henchmen locally in single-process
# mode: a direct-LLM provider (OpenAI / Anthropic; Ollama needs no extra
# deps), Slack intake, and the SQLite eval-history store. Deliberately
# excludes GCP and AWS SDKs.
local = [
    "henchmen[openai,anthropic,slack,evals]",
]
# SQLite backend for `henchmen eval run/history/compare`
# (src/henchmen/evals/storage.py).
evals = [
    "aiosqlite",
]
all = [
    "henchmen[gcp,aws,local,jira,observability]",
]
# Developer tooling only — no runtime dependencies. Layer this on top of
# whichever runtime extras you installed, e.g. `pip install -e ".[local,dev]"`.
#
# ruff is pinned to the minor line the pre-commit hook and CI both use: the
# formatter style changes between minor releases, so an unpinned ruff makes
# `ruff format --check` in CI disagree with the hook that formatted the code.
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly",
    "ruff>=0.15.4,<0.16",
    "mypy",
    # tests/unit/test_eval_storage.py imports evals.storage, which imports
    # aiosqlite at module scope — without it the unit suite fails to collect.
    "henchmen[evals]",
]
# Full stack + dev tooling. Needed to run the integration test suite because
# tests/integration/conftest.py imports google.cloud.{pubsub_v1,firestore,storage}
# (patched with in-memory fakes, but the modules must still be importable).
dev-integration = [
    "henchmen[all,dev]",
]

[tool.setuptools.packages.find]
# The eval harness lives at src/henchmen/evals/ precisely so it ships with the
# distribution; `evals/` at the repo root holds only fixtures and baseline.json
# (data read from the checkout, never imported).
where = ["src"]

[tool.setuptools.package-data]
henchmen = ["console/static/*", "console/static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET", "ASYNC", "T20", "C4"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# The CLI intentionally uses print() for user-facing output (and its wizard
# prompts run past 120 columns). structured_logging.py writes JSON lines to
# stdout for Cloud Run log ingestion.
"src/henchmen/cli/*.py" = ["T201", "E501"]
"src/henchmen/observability/structured_logging.py" = ["T201"]
# Arsenal file-system tools deliberately use blocking I/O for simplicity —
# operatives run in single-use Cloud Run Jobs so async file access would
# add complexity without latency benefit.
# Each entry lists only the codes that actually fire today, so a newly
# introduced blocking call is reported instead of being silently masked.
"src/henchmen/arsenal/tools/code_edit.py" = ["ASYNC230", "ASYNC240"]
"src/henchmen/arsenal/tools/code_intel.py" = ["ASYNC230", "ASYNC240"]
"src/henchmen/arsenal/tools/test_runner.py" = ["ASYNC240"]
"src/henchmen/arsenal/tools/git_ops.py" = ["ASYNC240"]
"src/henchmen/mastermind/scheme_executor/handlers.py" = ["ASYNC240"]
"src/henchmen/operative/bootstrap.py" = ["ASYNC230", "ASYNC240"]
"src/henchmen/operative/agent_builder.py" = ["ASYNC230", "ASYNC240"]
"src/henchmen/forge/ci_runner.py" = ["ASYNC240"]
"src/henchmen/dossier/cache.py" = ["ASYNC240"]
"src/henchmen/dossier/rules.py" = ["ASYNC240"]
# The Console runs single-user on a local machine; a config-file existence
# check is cheap enough that a blocking pathlib call is not worth an anyio
# dependency.
"src/henchmen/console/app.py" = ["ASYNC240"]
# Fixture repos under evals/ are deliberately unpolished sample code.
"evals/**/*.py" = ["T201"]
# Tests get a relaxed ruleset — assert-raises-Exception, print-for-debug,
# and blocking-IO-in-async-tests are all idiomatic.
"tests/**/*.py" = ["T201", "B017", "ASYNC230", "ASYNC240", "ASYNC221", "SIM105"]

[tool.pytest.ini_options]
# Strict asyncio mode: every async test must be explicitly marked with
# @pytest.mark.asyncio (and every async fixture with @pytest_asyncio.fixture).
# Rationale: "explicit > implicit" — keeps the marks load-bearing so that the
# mode cannot be flipped accidentally without breaking tests loudly. See
# CONTRIBUTING.md for the convention.
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that exercise multiple components. Requires the [dev-integration] extras. Skip with -m 'not integration' for the fast local loop.",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Eval fixtures are deliberately broken sample repos (that is the point of the
# harness) — type-checking them would always fail.
exclude = ["^evals/fixtures/"]
# Third-party libraries without py.typed markers (yaml, google-auth, etc.)
# are tolerated globally instead of requiring per-file ``# type: ignore``
# markers that become stale when CI and dev environments differ in which
# stub packages they have installed.
disable_error_code = ["import-untyped"]
