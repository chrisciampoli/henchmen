# Local commit gate. Keep the ruff `rev` in lockstep with the `ruff` pin in
# pyproject's [dev] extra: older ruff releases cannot even parse this repo's
# pyproject (ASYNC240 was only added in ruff 0.14), and the formatter style
# changes between minor releases, so a mismatched hook either errors on every
# commit or reformats files CI then rejects.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
