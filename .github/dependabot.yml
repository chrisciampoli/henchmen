version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - chrisciampoli
    labels:
      - dependencies
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /containers/dispatch
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - chrisciampoli
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /containers/mastermind
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - chrisciampoli
    labels:
      - dependencies
    # Node base images stay on the current LTS major. Dependabot proposes each
    # new major (odd releases never become LTS; even ones only in October), so
    # major bumps are taken by hand when a release enters LTS.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /containers/forge
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - chrisciampoli
    labels:
      - dependencies
    # Node base images stay on the current LTS major. Dependabot proposes each
    # new major (odd releases never become LTS; even ones only in October), so
    # major bumps are taken by hand when a release enters LTS.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /containers/operative
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - chrisciampoli
    labels:
      - dependencies
    # Node base images stay on the current LTS major. Dependabot proposes each
    # new major (odd releases never become LTS; even ones only in October), so
    # major bumps are taken by hand when a release enters LTS.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    assignees:
      - chrisciampoli
    labels:
      - dependencies
