name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new push arrives to the same ref.
# Saves CI minutes and prevents stale-branch races on :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (lint tooling only)
        run: pip install -e ".[dev]"

      # evals/ is linted too: the harness under src/ is covered by src/, and
      # the fixture repos under evals/ carry their own per-file-ignores in
      # pyproject, so nothing keeps them clean unless CI looks at them.
      - name: Ruff check
        run: ruff check src/ tests/ evals/

      - name: Ruff format check
        run: ruff format --check src/ tests/ evals/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (full stack — mypy needs cloud SDKs to type-check imports)
        run: pip install -e ".[dev-integration]"

      # evals/fixtures is excluded in pyproject — those repos are broken on
      # purpose. Everything else under evals/ is checked.
      - name: mypy
        run: mypy src/ evals/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Same gitleaks version as the pre-commit hook, run from the official
      # image so the CLI needs no marketplace action or license key. `dir`
      # scans the checked-out tree, which is exactly the content the PR adds.
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 dir . --config .gitleaks.toml --redact --verbose

  test:
    name: Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor in requires-python; 3.14 is what the container
        # images run, so both ends of the supported range are exercised.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev-integration]"

      - name: pytest (unit only — fast loop)
        env:
          HENCHMEN_PROVIDER: local
          HENCHMEN_GCP_PROJECT_ID: test-project
        run: pytest tests/unit/ -v --tb=short -m "not integration"

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (full stack — integration suite imports google.cloud.*)
        run: pip install -e ".[dev-integration]"

      - name: pytest (integration suite)
        env:
          HENCHMEN_PROVIDER: local
          HENCHMEN_GCP_PROJECT_ID: test-project
          HENCHMEN_ENVIRONMENT: dev
        run: pytest tests/integration/ -v --tb=short

  docker-build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [dispatch, mastermind, forge, operative]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # release.yml builds all four images on a tag push. Without this job the
      # operative image — the one every task actually runs in — would first be
      # built at release time, so a broken Dockerfile or requirements pin only
      # surfaced when cutting a release.
      - name: docker build
        run: docker build -f "containers/${{ matrix.service }}/Dockerfile" -t "henchmen-${{ matrix.service }}:ci" .

      # Import the module the container actually starts, not just the package
      # root: a dependency missing from the service's requirements.txt only
      # fails when its entry module (and what that pulls in) is imported.
      - name: Smoke-import the service entry module inside the image
        run: |
          set -euo pipefail
          case "${{ matrix.service }}" in
            operative) module=henchmen.operative.bootstrap ;;
            *) module="henchmen.${{ matrix.service }}.server" ;;
          esac
          docker run --rm --entrypoint python "henchmen-${{ matrix.service }}:ci" \
            -c "import importlib, henchmen; importlib.import_module('${module}'); print('henchmen', henchmen.__version__, '${module} OK')"

  docker-compose-smoke:
    name: docker-compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal .env.local
        run: |
          cat > .env.local <<'EOF'
          HENCHMEN_PROVIDER=local
          HENCHMEN_ENVIRONMENT=dev
          HENCHMEN_GCP_PROJECT_ID=test-project
          HENCHMEN_LLM_OLLAMA_SKIP_PROBE=1
          EOF
          # Strip leading whitespace from heredoc (YAML indentation artifact)
          sed -i 's/^[[:space:]]*//' .env.local

      # The real `ollama` image is ~2GB and would bloat CI. The compose
      # file depends on Ollama being healthy, so stub it out with a
      # tiny HTTP server that returns 200 on any path + a fake `ollama`
      # CLI that exits 0 (satisfying the `ollama list` healthcheck).
      # Keep this tag in sync with docker-compose.yml.
      - name: Stub Ollama image (HTTP responder + fake CLI)
        run: |
          mkdir -p ci/stub-ollama
          cat > ci/stub-ollama/Dockerfile <<'DEOF'
          FROM python:3.12-alpine
          RUN printf 'from http.server import BaseHTTPRequestHandler, HTTPServer\nclass H(BaseHTTPRequestHandler):\n    def do_GET(self): self.send_response(200); self.end_headers(); self.wfile.write(b"[]")\n    def do_POST(self): self.send_response(200); self.end_headers(); self.wfile.write(b"{}")\n    def log_message(self, *a): pass\nHTTPServer(("0.0.0.0", 11434), H).serve_forever()\n' > /srv.py
          RUN printf '#!/bin/sh\nexit 0\n' > /usr/local/bin/ollama && chmod +x /usr/local/bin/ollama
          EXPOSE 11434
          CMD ["python", "/srv.py"]
          DEOF
          docker build -t ollama/ollama:0.34.0 ci/stub-ollama

      - name: docker compose up -d
        run: docker compose up -d --build

      # Fail-closed health gate. `docker compose ps` without -a hides exited
      # containers, and grepping for the word "healthy" anywhere in the output
      # passed while a service was dead. Require EVERY service declared in the
      # compose file to be running and healthy, and bail out immediately on a
      # container that exited or died.
      - name: Wait for every service to become healthy
        run: |
          set -euo pipefail
          services=$(docker compose config --services)
          expected=$(echo "$services" | wc -l)
          echo "[smoke] expecting $expected healthy service(s): $(echo "$services" | tr '\n' ' ')"
          deadline=$((SECONDS + 180))
          while [ $SECONDS -lt $deadline ]; do
            state=$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}')
            echo "[smoke] $state"
            if echo "$state" | grep -Eq '^[^ ]+ (exited|dead|paused|removing)\b'; then
              echo "[smoke] FAIL: a service is not running"
              docker compose ps -a
              docker compose logs --tail=200
              exit 1
            fi
            healthy=0
            for svc in $services; do
              if echo "$state" | grep -Eq "^${svc} running .*\(healthy\)"; then
                healthy=$((healthy + 1))
              fi
            done
            if [ "$healthy" -eq "$expected" ]; then
              echo "[smoke] all $expected services are running and healthy"
              exit 0
            fi
            sleep 5
          done
          echo "[smoke] FAIL: timed out waiting for all services to become healthy"
          docker compose ps -a
          docker compose logs --tail=200
          exit 1

      # Proves the stack actually routes: the single-process server mounts
      # Dispatch, Mastermind and Forge, so all three health endpoints must
      # answer through the one published port.
      - name: Probe mounted service endpoints
        run: |
          set -euo pipefail
          for path in /health /dispatch/health /mastermind/health /forge/health; do
            echo "[smoke] GET $path"
            curl --fail --silent --show-error --max-time 10 "http://localhost:8000${path}" > /dev/null
          done
          echo "[smoke] dispatch, mastermind and forge all responded"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: docker compose down
        if: always()
        run: docker compose down --volumes --remove-orphans
