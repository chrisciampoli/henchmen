name: Evals

# Manually-triggered workflow for running the Henchmen eval harness
# against one LLM provider and opening a pull request with the updated
# evals/baseline.json. This is how the maintainer and community
# contributors populate per-provider parity numbers without the main CI
# having to burn LLM credits on every push.

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider to evaluate"
        required: true
        type: choice
        options:
          - openai
          - anthropic
          - vertex
          # `ollama` is deliberately absent: a hosted runner has no Ollama
          # server and pulling a coding model would blow the job budget. Run
          # it locally instead:
          #   henchmen eval run --provider ollama --write-baseline
      fixture:
        description: "Fixture to run (leave blank to run every fixture)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.provider }}
  cancel-in-progress: true

jobs:
  run-eval:
    name: Run eval (${{ github.event.inputs.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      # `all` rather than `local`: the vertex option resolves VertexAIProvider,
      # which imports google.genai — not part of the local extra.
      - name: Install dependencies (all providers + dev)
        run: pip install -e ".[all,dev]"

      - name: Run eval
        env:
          HENCHMEN_PROVIDER: local
          HENCHMEN_ENVIRONMENT: dev
          HENCHMEN_OPENAI_API_KEY: ${{ secrets.HENCHMEN_OPENAI_API_KEY }}
          HENCHMEN_ANTHROPIC_API_KEY: ${{ secrets.HENCHMEN_ANTHROPIC_API_KEY }}
          HENCHMEN_GCP_PROJECT_ID: ${{ secrets.HENCHMEN_GCP_PROJECT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail

          PROVIDER="${{ github.event.inputs.provider }}"
          FIXTURE="${{ github.event.inputs.fixture }}"

          # Write the GCP credentials file if a vertex run was requested.
          if [ "$PROVIDER" = "vertex" ] && [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            install -m 600 /dev/null /tmp/gcp-sa.json
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/gcp-sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa.json
          fi

          # Explicit `run` sub-command; running every fixture is the default
          # when --fixture is omitted.
          if [ -z "$FIXTURE" ]; then
            henchmen eval run --provider "$PROVIDER" --write-baseline
          else
            henchmen eval run --provider "$PROVIDER" --fixture "$FIXTURE"
          fi

      - name: Show diff
        run: git diff --stat evals/baseline.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # GitHub does not run `pull_request` workflows for PRs opened with the
          # default GITHUB_TOKEN, so the baseline PR would show no checks. Set
          # an EVALS_PR_TOKEN (PAT or GitHub App token) to get CI on it.
          token: ${{ secrets.EVALS_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: "evals/update-${{ github.event.inputs.provider }}"
          title: "evals: refresh ${{ github.event.inputs.provider }} baseline"
          body: |
            Automated PR from the `evals.yml` workflow. Ran the eval harness for the
            **${{ github.event.inputs.provider }}** provider and is proposing the updated
            `evals/baseline.json` for review.

            ### Trigger
            - Provider: `${{ github.event.inputs.provider }}`
            - Fixture: `${{ github.event.inputs.fixture || 'all' }}`
            - Actor: @${{ github.actor }}
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Review checklist
            - [ ] Numbers look sane (no NaN / null scores)
            - [ ] No secrets leaked into the diff
            - [ ] `last_updated` timestamp is today
            - [ ] CI ran on this PR (if not, `EVALS_PR_TOKEN` is unset — push an empty commit)
          commit-message: "evals: refresh ${{ github.event.inputs.provider }} baseline"
          add-paths: |
            evals/baseline.json
