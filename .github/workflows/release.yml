name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # A tag push does not re-run the PR gates, so repeat them here. Without this
  # a red commit could be tagged and published.
  verify:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev-integration]"

      - name: Ruff check
        run: ruff check src/ tests/ evals/

      - name: Ruff format check
        run: ruff format --check src/ tests/ evals/

      - name: mypy
        run: mypy src/ evals/

      - name: pytest
        env:
          HENCHMEN_PROVIDER: local
          HENCHMEN_GCP_PROJECT_ID: test-project
          HENCHMEN_ENVIRONMENT: dev
        run: pytest tests/ -v --tb=short

  images:
    name: Build & push images
    needs: verify
    runs-on: ubuntu-latest
    # Five images for linux/amd64 and linux/arm64, the arm64 half emulated under QEMU.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # GHCR container images — build all 4 service containers and push
      # them to ghcr.io so self-hosters can pull without Artifact Registry.
      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 images are required: Apple Silicon Macs run the local image,
      # and amd64-only images would run under slow emulation or not at all.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push container images
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          # GHCR rejects uppercase paths and github.repository preserves the owner's
          # login case, so forks with a mixed-case login would fail without this.
          REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          for svc in dispatch mastermind forge operative; do
            docker buildx build --platform linux/amd64,linux/arm64 \
              -f "containers/${svc}/Dockerfile" \
              -t "${REPO}/${svc}:${TAG}" -t "${REPO}/${svc}:latest" \
              --push .
          done
          # The local all-in-one image the Henchmen Desktop app runs.
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f containers/mastermind/Dockerfile --target local \
            -t "${REPO}/local:${TAG}" -t "${REPO}/local:latest" \
            --push .

  # The GitHub Release is created last: publishing it before the images meant a
  # failed `docker push` left a release advertising images that do not exist,
  # and the tag could not be re-pushed without deleting the release first.
  publish:
    name: Publish GitHub Release
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      # Guards against a mistyped tag shipping the previous version's wheel
      # under a new release name. Compared with packaging.Version so PEP 440
      # normalisation (v1.0.0-rc1 -> 1.0.0rc1) does not cause a false mismatch.
      - name: Verify package imports and matches the tag
        run: |
          set -euo pipefail
          pip install dist/*.whl
          built=$(python -c "import henchmen; print(henchmen.__version__)")
          echo "built version: ${built}; tag: ${GITHUB_REF_NAME}"
          python - "$built" "${GITHUB_REF_NAME#v}" <<'PY'
          import sys
          from packaging.version import Version

          built, tag = Version(sys.argv[1]), Version(sys.argv[2])
          if built != tag:
              sys.exit(
                  f"ERROR: tag {sys.argv[2]} does not match packaged version {sys.argv[1]}. "
                  "Update the 'version' field in pyproject.toml or re-tag."
              )
          print("version/tag match")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          files: dist/*
          prerelease: ${{ contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
